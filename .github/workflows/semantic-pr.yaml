name: Semantic PR
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  semantic:
    if: github.event_name == 'pull_request'
    name: Semantic PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR title and all commits using metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          # BEGIN SEMANTIC POLICY
          def errors(title, commits, files, renovate=False):
              messages = [title, *commits]
              problems = []
              pattern = r"^(?:feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(?:\([^()\r\n]+\))?!?: \S[^\r\n]*$"
              for index, message in enumerate(messages):
                  subject = message.splitlines()[0] if message else ""
                  if not re.fullmatch(pattern, subject):
                      problems.append(f"{'PR title' if index == 0 else f'Commit {index}'} must use Conventional Commit syntax")
              if not commits:
                  problems.append("No commits found; refusing an incomplete validation")
              workflow_only = bool(files) and all(path.startswith(".github/") for path in files)
              if workflow_only:
                  for message in messages:
                      subject = message.splitlines()[0] if message else ""
                      if not re.match(r"^ci(?:\([^)]*\))?: ", subject):
                          problems.append("Workflow-only PRs and all their commits must use ci: or ci(scope):")
              if renovate and workflow_only and any(not message.startswith("ci(deps): ") for message in messages):
                  problems.append("Workflow-only Renovate updates must use ci(deps):")
              return problems
          # END SEMANTIC POLICY

          number = os.environ['PR_NUMBER']
          if not number.isdecimal():
              raise SystemExit('Invalid PR number')
          base = f"{os.environ['API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}"
          def get(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def pages(suffix):
              items = []
              for page in range(1, 32):
                  batch = get(f'{base}/{suffix}?per_page=100&page={page}')
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
              raise SystemExit('Pagination exceeded safety limit; refusing partial validation')
          pr = get(base)
          commits = pages('commits')
          files = pages('files')
          # GitHub caps these APIs: fail closed instead of silently checking a subset.
          if len(commits) != pr['commits'] or len(files) != pr['changed_files']:
              raise SystemExit('Incomplete PR metadata; split the PR to validate all commits/files')
          problems = errors(pr['title'], [c['commit']['message'] for c in commits],
                            [f['filename'] for f in files], pr['user']['login'] == 'renovate[bot]')
          if problems:
              # Output only fixed diagnostics, never interpolate untrusted messages.
              for problem in problems:
                  print(f'::error::{problem}')
              raise SystemExit(1)
          print('PR title and all commit subjects satisfy the semantic merge policy')
          PY
