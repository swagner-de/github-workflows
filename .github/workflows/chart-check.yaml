name: Chart Check
on:
  workflow_call:
    inputs:
      chart-path:
        required: true
        type: string
      image-repository:
        required: true
        type: string
      helm-repositories:
        description: "One name and HTTPS URL per line, separated by whitespace"
        type: string
        default: ''
      check-docs:
        description: "Require the chart README.md to match helm-docs v1.14.2 output"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check chart documentation
        if: inputs.check-docs
        env:
          CHART: ${{ inputs.chart-path }}
        run: |
          set -euo pipefail
          # BEGIN CHART DOCS CHECK
          test -f "$CHART/Chart.yaml"
          test -f "$CHART/README.md"
          test -f "$CHART/README.md.gotmpl"
          go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2 \
            --chart-search-root="$CHART" --chart-to-generate="$CHART" --dry-run \
            > "$RUNNER_TEMP/chart-README.md"
          test -s "$RUNNER_TEMP/chart-README.md"
          if ! cmp "$CHART/README.md" "$RUNNER_TEMP/chart-README.md"; then
            diff -u "$CHART/README.md" "$RUNNER_TEMP/chart-README.md" || true
            echo 'Chart documentation is stale; regenerate with helm-docs v1.14.2.' >&2
            exit 1
          fi
          # END CHART DOCS CHECK
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Validate chart and its published application
        env:
          HELM_REPOSITORIES: ${{ inputs.helm-repositories }}
          CHART: ${{ inputs.chart-path }}
          IMAGE: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          while read -r name repository extra; do
            [[ -z "$name" ]] && continue
            [[ "$name" =~ ^[A-Za-z0-9_-]+$ && "$repository" == https://* && -z "$extra" ]]
            helm repo add "$name" "$repository"
          done <<< "$HELM_REPOSITORIES"
          helm dependency build "$CHART"
          helm lint --strict "$CHART"
          helm template test "$CHART" > "$RUNNER_TEMP/rendered.yaml"
          version=$(helm show chart "$CHART" | sed -n 's/^appVersion: *//p' | tr -d '"\047')
          [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          docker manifest inspect "$IMAGE:$version" >/dev/null
