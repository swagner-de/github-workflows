name: Container Publish
on:
  workflow_call:
    inputs:
      release-sha:
        type: string
        required: true
      version:
        type: string
        required: true
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}
permissions: {}
jobs:
  build-scan:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-sha }}
          persist-credentials: false
      - name: Validate release identity
        env:
          SHA: ${{ inputs.release-sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: local/release:scanned
      - name: Scan each shipping architecture
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/release:scanned
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Generate per-architecture SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local/release:scanned
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Export the scanned image
        run: docker save local/release:scanned -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom.spdx.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: |
            image.tar
            sbom.spdx.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: shared-image-${{ github.repository }}-${{ inputs.version }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish immutable version from scanned artifacts
        id: manifest
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            echo 'Version already exists; refusing to overwrite. Verify provenance and retry attestations separately.' >&2
            exit 1
          fi
          refs=()
          for arch in amd64 arm64; do
            docker load -i "images/image-$arch/image.tar"
            ref="$image:build-$SHA-$arch"
            docker tag local/release:scanned "$ref"
            docker push "$ref"
            refs+=("$ref")
          done
          docker buildx imagetools create -t "$image:$VERSION" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -er '.digest')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest final multiarch digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Verify final attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
