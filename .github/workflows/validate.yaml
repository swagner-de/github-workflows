name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 scripts/validate_workflows.py
      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 .github/workflows/*.yaml
